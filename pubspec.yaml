name: finance
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  page_transition: ^2.2.2
  fl_chart: ^1.2.0
  drift: ^2.20.0

  path_provider: ^2.1.4
  path: ^1.9.0
  persian_datetime_picker: ^3.2.0
  crypto: 3.0.7
  local_auth: 3.0.2
  flutter_secure_storage: 11.2.0
  permission_handler: ^12.0.0
  flutter_sms_inbox: ^1.0.5

  # ⬇️ نسخه‌ها برای سازگاری با AGP 9
  flutter_local_notifications: 20.1.0
  timezone: 0.10.1
  workmanager: ^0.9.0+3
   
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.13.1 

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/

  fonts:
    - family: IranSans
      fonts:
        - asset: assets/fonts/Iranian Sans.ttf

    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf

    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-RD-Regular.ttf

# ⬇️ این بلاک جدید برای آیکون اپ
flutter_launcher_icons:
  android: "ic_launcher"                         # ← این رو عوض کن به ic_launcher
  ios: true
  image_path: "assets/icon/noxa_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#0E1B3D"
  adaptive_icon_foreground: "assets/icon/noxa_icon.png"